
name: Test Spine 4.3 and build Windows EXE

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DSPINE43_RUNTIME_TESTS=ON

      - name: Build Release
        run: >
          cmake --build build
          --config Release
          --target SpineSkeletonDataConverter Spine43RuntimeCheck Spine38PoseSample Spine43PoseSample
          --parallel 2

      - name: Test with official Spine 3.8 and 4.3 Runtimes
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = ".\build\Release\SpineSkeletonDataConverter.exe"
          if (!(Test-Path $exe)) {
            throw "EXE was not generated"
          }
          & $exe --help

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SpineSkeletonDataConverter-Windows-x64
          path: build/Release/SpineSkeletonDataConverter.exe
          if-no-files-found: error
          retention-days: 30
